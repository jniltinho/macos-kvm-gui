name: reims-gui release

# Tag reims-gui-v<version> (the version in reims-gui/Cargo.toml): one .deb and one .tar.gz, built
# on Ubuntu 24.04 and checked in clean 24.04 and 26.04 containers, plus the corresponding source
# (vendored crates and the build Dockerfile) and every crate's license text, on a GitHub Release
# of their own.

on:
  push:
    tags:
      - 'reims-gui-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check the tag against the workspace version
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' reims-gui/Cargo.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "reims-gui-v$version" || { echo "the tag must be reims-gui-v$version"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Build (in Ubuntu 24.04, one package for 24.04 and 26.04)
        run: reims-gui/scripts/build.sh

      - name: Install and run in clean ubuntu:24.04 and ubuntu:26.04
        run: |
          reims-gui/scripts/check-package.sh 24.04
          reims-gui/scripts/check-package.sh 26.04

      - name: Under GNOME's compositor (Mutter, Wayland + XWayland) in ubuntu:24.04 and ubuntu:26.04
        run: |
          sudo chmod 666 /dev/kvm
          reims-gui/scripts/check-gnome.sh 24.04
          reims-gui/scripts/check-gnome.sh 26.04

      - uses: actions/upload-artifact@v4
        with:
          name: reims-gui
          path: reims-gui/dist/*
          if-no-files-found: error

  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Source archive
        run: reims-gui/scripts/source-archive.sh

      - uses: actions/upload-artifact@v4
        with:
          name: reims-gui-source
          path: reims-gui/dist/*
          if-no-files-found: error

  release:
    needs: [build, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#reims-gui-}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: reims-gui (Rust) ${{ steps.v.outputs.version }}
          make_latest: true # reims-gui is the recommended app; the Go app's releases are not marked latest
          body: |
            > **For home lab use.** macOS is Apple's software, and its license only allows it on Apple-branded hardware.

            **This is the Rust app (`reims-gui`), the recommended version.** The older `macos-kvm-gui` in Go has its own `v*` releases; both read the same VMs and settings.

            reims-gui, the Rust rewrite of macos-kvm-gui (x86_64): one `.deb` for Ubuntu 24.04 and 26.04 and Debian 13, and one `.tar.gz` that also runs on Rocky Linux 10, each with a `.sha256`.

            The binaries are distributed under GPL-3.0-or-later (the source is GPL-2.0-or-later OR LGPL-3.0-or-later). `THIRD_PARTY_LICENSES` holds the license text of every crate compiled in; `reims-gui-*-source.tar.gz` is the corresponding source, with vendored crates and the build Dockerfile.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
