name: CI

# Disabled: the Go app is no longer built on push; reims-gui (Rust) has its own CI. Run it by
# hand from the Actions tab if needed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Fyne needs CGO with OpenGL, X11 and Wayland headers; qemu-img runs in the disk and media tests.
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols qemu-utils

      - name: Format, Vet and Test
        run: make test

      - name: Build
        run: make build-prod

  openspec:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate OpenSpec Changes
        run: npx -y @fission-ai/openspec@1.14.2 validate --all --strict
