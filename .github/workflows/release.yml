name: macos-kvm-gui (Go) release

# Manual only: run it on a v* tag (gh workflow run release.yml --ref vX.Y.Z). reims-gui (Rust),
# the recommended app, releases on reims-gui-v* tags and stays the latest release.
on:
  workflow_dispatch:

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Set timezone to America/Sao_Paulo
        run: sudo timedatectl set-timezone America/Sao_Paulo

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc pkg-config libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols qemu-utils rpm

      - name: Test
        run: make test

      # Builds the binary with the tag as its version, then the .tar.gz, the .deb, the .rpm and their SHA-256 files.
      - name: Build and Package
        run: make package-go VERSION=${GITHUB_REF_NAME}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: macos-kvm-gui (Go) ${{ github.ref_name }}
          make_latest: false # reims-gui (Rust) is the recommended app
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
