name: reims-gui CI

# The Rust rewrite (reims-gui/): checks in the Ubuntu 24.04 build image, then packages for both
# Ubuntu releases, each installed and run in a clean container. Everything runs in Docker.

on:
  push:
    paths:
      - 'reims-gui/**'
      - '.github/workflows/reims-gui-*.yml'
  pull_request:
    paths:
      - 'reims-gui/**'
      - '.github/workflows/reims-gui-*.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: fmt, clippy, tests
        run: |
          reims-gui/scripts/cargo-docker.sh 24.04 sh -c '
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo test --workspace --locked'

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        release: ['24.04', '26.04']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Build
        run: reims-gui/scripts/build.sh ${{ matrix.release }}

      - name: Install and run in a clean ubuntu:${{ matrix.release }}
        run: reims-gui/scripts/check-package.sh ${{ matrix.release }}

      - uses: actions/upload-artifact@v4
        with:
          name: reims-gui-${{ matrix.release }}
          path: reims-gui/dist/*
          if-no-files-found: error
