name: reims-gui CI

# The Rust rewrite (reims-gui/): checks in the Ubuntu 24.04 build image, then one package built on
# 24.04, installed and run in clean 24.04 and 26.04 containers. Everything runs in Docker.

on:
  push:
    paths:
      - 'reims-gui/**'
      - '.github/workflows/reims-gui-*.yml'
  pull_request:
    paths:
      - 'reims-gui/**'
      - '.github/workflows/reims-gui-*.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: fmt, clippy, tests
        run: |
          reims-gui/scripts/cargo-docker.sh 24.04 sh -c '
            cargo fmt --all --check
            cargo clippy --workspace --all-targets --locked -- -D warnings
            cargo test --workspace --locked'

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Build (in Ubuntu 24.04, one package for 24.04 and 26.04)
        run: reims-gui/scripts/build.sh

      - name: Install and run in clean ubuntu:24.04 and ubuntu:26.04
        run: |
          reims-gui/scripts/check-package.sh 24.04
          reims-gui/scripts/check-package.sh 26.04

      - name: Under GNOME's compositor (Mutter, Wayland + XWayland) in ubuntu:24.04 and ubuntu:26.04
        run: |
          sudo chmod 666 /dev/kvm
          reims-gui/scripts/check-gnome.sh 24.04
          reims-gui/scripts/check-gnome.sh 26.04

      - uses: actions/upload-artifact@v4
        with:
          name: reims-gui
          path: reims-gui/dist/*
          if-no-files-found: error
