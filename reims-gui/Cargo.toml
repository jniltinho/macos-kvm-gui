[workspace]
resolver = "3"
members = ["crates/*", "apps/reims-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"
repository = "https://github.com/jniltinho/macos-kvm-gui"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
rg-core = { path = "crates/rg-core" }
rg-assets = { path = "crates/rg-assets" }
rg-host = { path = "crates/rg-host" }
rg-macos = { path = "crates/rg-macos" }
rg-qemu = { path = "crates/rg-qemu" }
rg-reims = { path = "crates/rg-reims" }
rg-x11 = { path = "crates/rg-x11" }
rg-ui = { path = "crates/rg-ui" }
rg-agent = { path = "crates/rg-agent" }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process"] }
parking_lot = "=0.12.5"
sha2 = "=0.11.1"
regex = "=1.13.1"
clap = { version = "=4.6.7", features = ["derive"] }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts", "persistence"] }
egui = "=0.36.2"
egui_extras = { version = "=0.36.2", features = ["image", "svg"] }
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
rmcp = { version = "=3.5.1", features = ["server", "transport-io"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
dirs = "=7.0.0"
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
