[workspace]
resolver = "3"
members = ["crates/*", "apps/reims-gui"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.99"
license = "GPL-2.0-or-later OR LGPL-3.0-or-later"
repository = "https://github.com/jniltinho/macos-kvm-gui"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[workspace.dependencies]
rg-core = { path = "crates/rg-core" }
rg-assets = { path = "crates/rg-assets" }
rg-host = { path = "crates/rg-host" }
rg-macos = { path = "crates/rg-macos" }
rg-qemu = { path = "crates/rg-qemu" }
rg-reims = { path = "crates/rg-reims" }
rg-ops = { path = "crates/rg-ops" }
rg-x11 = { path = "crates/rg-x11" }
rg-ui = { path = "crates/rg-ui" }
rg-agent = { path = "crates/rg-agent" }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "process", "signal"] }
parking_lot = "=0.12.5"
sha2 = "=0.11.1"
regex = "=1.13.1"
clap = { version = "=4.6.7", features = ["derive"] }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "default_fonts", "persistence"] }
egui = "=0.36.2"
egui_extras = { version = "=0.36.2", features = ["image", "svg"] }
egui_kittest = { version = "=0.36.2", features = ["wgpu", "snapshot"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
rmcp = { version = "=3.5.1", features = ["server", "transport-io"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
dirs = "=7.0.0"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.10"
hex = "=0.4.3"
rcgen = "=0.14.10"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
tempfile = "=3.27.0"
rsa = "=0.9.10"
plist = { version = "=1.10.1", default-features = false }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde_yaml_ng = "=0.10.0"
fastrand = "=2.5.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
include_dir = "=0.7.4"
x11rb = "=0.13.2"
sdl3 = { version = "=0.20.0", features = ["build-from-source-static"] }
# rg-ui: the XDG desktop portal's file chooser (rustXterm's pin).
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "file_chooser"] }
# rg-ui: the app's X11 window id (eframe::Frame's handle) and winit's EventLoopBuilderExtX11,
# which eframe does not re-export. Already in Cargo.lock through eframe; pinned to it.
raw-window-handle = "=0.6.2"
winit = { version = "=0.30.13", default-features = false, features = ["x11"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
